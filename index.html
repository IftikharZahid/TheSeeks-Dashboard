<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_square.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Seeks Academy — Admin Dashboard</title>
    <meta name="description" content="The Seeks Academy — Education Management System and Admin Dashboard" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://theseeksdashboard.vercel.app/" />
    <meta property="og:title" content="The Seeks Academy — Admin Dashboard" />
    <meta property="og:description" content="The Seeks Academy — Education Management System and Admin Dashboard" />
    <meta property="og:image" content="https://theseeksdashboard.vercel.app/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://theseeksdashboard.vercel.app/" />
    <meta property="twitter:title" content="The Seeks Academy — Admin Dashboard" />
    <meta property="twitter:description" content="The Seeks Academy — Education Management System and Admin Dashboard" />
    <meta property="twitter:image" content="https://theseeksdashboard.vercel.app/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }

      const savedLayout = localStorage.getItem('layout');
      if (savedLayout === 'compact') {
        document.documentElement.setAttribute('data-layout', 'compact');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
